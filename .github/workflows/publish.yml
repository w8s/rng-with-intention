name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # What counts as passing is defined once, in gate.yml. Nothing is published
  # unless every check in it passes on the tagged commit.
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # No dependency install here: nothing this job runs needs one, and this is
    # the job that holds the npm publishing token.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to support Trusted Publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish --provenance --access public
